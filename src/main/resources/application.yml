server:
  port: 8081

spring:
  application:
    name: agent-orchestration-demo

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: agent-task-consumer
      auto-offset-reset: earliest

# ======== LLM ========
langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model-name: ${OPENAI_MODEL:gpt-4o-mini}
    temperature: 0.2

# ======== Milvus ========
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection: agent_memory

# ======== Agent 防护参数 ========
agent:
  guard:
    max-tool-calls: 8          # 单任务最大工具调用次数
    token-budget: 100000        # 单任务 token 预算
    max-concurrent-per-user: 3  # 单用户并发任务上限
  hitl:
    high-risk-tools: dropTable,deleteOrder,refund  # 高危工具触发人工介入

# ======== Resilience4j ========
resilience4j:
  retry:
    instances:
      toolNetworkRetry:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
  circuitbreaker:
    instances:
      toolCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

# ======== MCP 客户端（默认关闭，需要 Node.js 环境） ========
mcp:
  enabled: ${MCP_ENABLED:false}

# ======== A2A 服务（默认关闭） ========
a2a:
  enabled: ${A2A_ENABLED:false}

# ======== 日志 ========
logging:
  level:
    com.xb.agent: DEBUG
